name: Qwen 纯 API 中文版发布

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "纯 API Qwen 中文版发布标签，例如 v2.20.13"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: 校验发布标签
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "RELEASE_TAG must match v<major>.<minor>.<patch>"
          }

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 构建并发布纯 API 中文版
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          # 纯 API 版本采用手动下载安装包，不生成自动更新元数据。
          args: --no-sign
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "NexQ Qwen 纯 API 中文版 ${{ env.RELEASE_TAG }}"
          releaseBody: "NexQ Qwen 纯 API 中文版：简体中文界面、托盘和 Windows 安装器；文本、翻译使用 Qwen LLM，语音识别使用 Qwen3-ASR-Flash，音频与会议历史保留在本地。请下载 x64-setup.exe 安装。"
          releaseDraft: false
          prerelease: false
