name: Remote-only Release

on:
  push:
    tags:
      - "remote-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Remote-only release tag, for example remote-v2.20.10"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^remote-v\d+\.\d+\.\d+$') {
            throw "RELEASE_TAG must match remote-v<major>.<minor>.<patch>"
          }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build remote-only Tauri app
        uses: tauri-apps/tauri-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_NEXQ_REMOTE_ONLY: "true"
        with:
          tauriScript: npm run tauri
          # Direct installation does not require updater signing. Keep this
          # release usable even when repository signing secrets are absent.
          args: --no-sign --features remote-only -- --no-default-features
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: "NexQ Remote-only ${{ env.RELEASE_TAG }}"
          releaseBody: "Remote-only build: cloud STT/translation/LLM, local audio capture and SQLite history. Download the x64-setup.exe installer."
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: false
