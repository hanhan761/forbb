[package]
name = "nexq"
version = "2.20.13"
description = "AI Meeting Assistant & Real-Time Interview Copilot"
authors = ["NexQ"]
edition = "2021"

[features]
# NexQ ships one product: the Simplified Chinese, pure API build. The legacy
# local-ai feature remains opt-in for source compatibility, but is not part of
# the default build or any release workflow.
default = ["remote-only"]
local-ai = [
    "dep:whisper-rs",
    "dep:sha2",
    "dep:ort",
    "dep:ndarray",
    "dep:rustfft",
    "dep:tokenizers",
    "dep:tar",
    "dep:bzip2",
]
remote-only = []

# Keep the shipped desktop binary small. Debug symbols are not needed in the
# installer and are the main avoidable part of the release artifact.
[profile.release]
strip = "symbols"

[lib]
name = "nexq_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-process = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json", "stream", "multipart"] }
async-trait = "0.1"
futures = "0.3"
anyhow = "1"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dotenvy = "0.15"
cpal = "0.15"
hound = "3.5"
pdf-extract = "0.7"
lopdf = "0.32"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
url = "2"
base64 = "0.22"
whisper-rs = { version = "0.16", optional = true }
sha2 = { version = "0.10", optional = true }
zip = "2"
ort = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"], optional = true }
ndarray = { version = "0.17", optional = true }  # Must match ort's ndarray version
rustfft = { version = "6", optional = true }
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }
tar = { version = "0.4", optional = true }
bzip2 = { version = "0.5", optional = true }
ogg = "0.9"
libopus_sys = { version = "0.3", features = ["static", "bundled"] }
image = { version = "0.25", default-features = false, features = ["png"] }
encoding_rs = "0.8"

# Windows-specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Security_Credentials",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Media_SpeechRecognition",
    "Media_Core",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Globalization",
    # SAPI 5.x for Windows Native STT (supports custom audio streams)
    "Win32_Media_Speech",
    # COM initialization for SAPI thread
    "Win32_System_Com",
    # Audio session enumeration + peak meters (IAudioMeterInformation)
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    # Process info for session monitor
    "Win32_System_Threading",
    # Device property store (friendly names)
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
] }
wasapi = "0.22"
